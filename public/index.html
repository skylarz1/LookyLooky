<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookyLooky</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <script src="/js/compat.js"></script>
  <style>
    :root { --bg:#0f1117; --surface:#1a1d27; --border:#2a2d3a; --text:#e1e4ed; --dim:#8b8fa3; --accent:#f2711c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { display: flex; align-items: center; gap: 10px; font-size: 24px; margin: 0 0 18px; }
    h1 img { width: 30px; height: 30px; }
    a { color: var(--accent); text-decoration: none; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; color: var(--text); display: block; }
    .tile b { display: block; margin-bottom: 4px; } .tile span { color: var(--dim); font-size: 13px; }
    .tile:hover { border-color: var(--accent); }
    h2 { font-size: 15px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin: 26px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; } li { padding: 7px 0; border-bottom: 1px solid var(--border); display: flex; gap: 14px; flex-wrap: wrap; }
    li .n { flex: 1; min-width: 150px; }
  </style>
</head>
<body>
<main>
  <h1><img src="/images/cameras/icon.svg" alt=""> LookyLooky</h1>
  <div class="tiles">
    <a class="tile" href="/cameras.html"><b>Dashboard</b><span>Cameras, layouts, recordings, settings</span></a>
    <a class="tile" href="/wall.html"><b>Camera wall</b><span>Main pane over six previews</span></a>
    <a class="tile" href="/camera-view.html"><b>View-only board</b><span>For wall displays and kiosks</span></a>
    <a class="tile" href="/setup.html"><b>Setup &amp; help</b><span>Certificate for iPad, iPhone and PCs</span></a>
  </div>
  <h2>Layouts</h2>
  <ul id="layouts"><li class="n" style="color:var(--dim)">Loading…</li></ul>
</main>
<script>
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  fetch('/api/layouts').then((r) => r.json()).then(({ layouts }) => {
    document.getElementById('layouts').innerHTML = (layouts || []).map((l) => {
      const id = encodeURIComponent(l.id);
      return `<li><span class="n">${esc(l.name)}</span><a href="/camera-view.html?layout=${id}">View</a><a href="/wall.html?layout=${id}">Wall</a></li>`;
    }).join('') || '<li>No layouts yet.</li>';
  }).catch(() => { document.getElementById('layouts').innerHTML = '<li>Could not reach the server.</li>'; });
  if (!LookyCompat.webcodecs) LookyCompat.insecureBanner('[LookyLooky.SecurePort]');
</script>
</body>
</html>
