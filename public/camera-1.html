<!DOCTYPE html>
<!--
  The old camera-1.htm test page: a camera's live MP4 drawn onto a canvas.
  It used to point the <video> straight at the camera (http://192.168.1.168/live.mp4?channel=0&type=2),
  which needs the camera's login in the browser and its address reachable from it. It now goes through
  LookyLooky's /stream/:id proxy (camera-proxy compatible), which logs in for you.

  /camera-1.html?camera=front-door
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookyLooky - Camera test</title>
  <style>
    body { margin: 0; background: #0f1117; color: #e1e4ed; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    canvas { display: block; width: 100%; max-width: 1280px; height: auto; background: #000; margin: 0 auto; }
    p { text-align: center; color: #8b8fa3; }
  </style>
</head>
<body>
<video id="cam" autoplay muted playsinline style="display:none"></video>
<canvas id="feed" width="1280" height="720"></canvas>
<p id="note"></p>

<script>
const id = new URLSearchParams(location.search).get('camera') || 'front-door';
const video = document.getElementById('cam');
const canvas = document.getElementById('feed');
const ctx = canvas.getContext('2d');
const note = document.getElementById('note');

note.textContent = `Camera "${id}" via /stream/${id} — HTTP cameras pass through as-is; others redirect to MJPEG.`;
video.src = `/stream/${encodeURIComponent(id)}`;
video.play().catch(() => {});

function draw() {
  if (!video.paused && !video.ended && video.readyState >= 2) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(draw);
}

video.oncanplay = () => {
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  draw();
};

// A non-HTTP camera redirects to MJPEG, which <video> cannot play: show it as an image instead.
video.onerror = () => {
  const img = new Image();
  img.onload = () => {
    const loop = () => { canvas.width = img.naturalWidth || 640; canvas.height = img.naturalHeight || 360; ctx.drawImage(img, 0, 0); requestAnimationFrame(loop); };
    loop();
  };
  img.src = `/stream/${encodeURIComponent(id)}/mjpeg`;
};
</script>
</body>
</html>
